name: APK

# Her push'ta Anfo'nun Android APK'sını derler; hem iş akışı çıktısı (artifact) olarak
# hem de "apk-<dal>" etiketli GitHub sürümüne (Release) Anfo.apk olarak yükler.
on:
  push:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Web derlemesi ve Capacitor eşitleme
        run: |
          npm ci
          npm run android

      - name: APK derlemesi
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Anfo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Anfo-apk
          path: Anfo.apk

      - name: Sürüm adı
        id: tag
        run: echo "tag=apk-$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: GitHub sürümüne yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Anfo APK (${{ github.ref_name }})
          prerelease: true
          make_latest: false
          body: |
            Otomatik derleme — commit ${{ github.sha }}
            Debug imzalı; telefona doğrudan kurulabilir (bilinmeyen kaynaklara izin ver).
          files: Anfo.apk
