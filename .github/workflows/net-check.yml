name: Uç nokta kontrolü

# Piyasa / haber widget'larının dış kaynaklarını hızlıca dener (model testinden bağımsız, ~30 sn).
on:
  push:
    paths: ['e2e/net-check.cjs', 'src/features/market.js', '.github/workflows/net-check.yml']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node e2e/net-check.cjs
